<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Typing Benvchmark</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e;
    color: #e0e0e0;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 20px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 600; color: #fff; }

  #controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 8px 20px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #3a3a3a; }
  button.active { background: #c0392b; border-color: #e74c3c; }

  label { font-size: 13px; color: #999; }
  select {
    padding: 6px 10px;
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
  }

  canvas {
    border: 1px solid #333;
    border-radius: 4px;
    display: block;
  }

  #stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 700px;
  }
  .stat {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
  }
  .stat-value { font-size: 22px; font-weight: 700; color: #e8a045; }
  .stat-label { font-size: 11px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

  #log {
    width: 100%;
    max-width: 700px;
    background: #111;
    border: 1px solid #222;
    border-radius: 6px;
    padding: 12px;
    font-family: monospace;
    font-size: 12px;
    color: #666;
    height: 100px;
    overflow-y: auto;
  }
  #log p { margin: 2px 0; }
  #log p.hi { color: #aaa; }
</style>
</head>
<body>

<h1>Terminal Typing Benchmark</h1>

<div id="controls">
  <button id="btnStart">▶ Start</button>
  <button id="btnReset">↺ Reset</button>
  <label>Mode:
    <select id="modeSelect">
      <option value="keystroke">Keystroke (1 char/frame)</option>
      <option value="burst">Burst (full paste)</option>
      <option value="scroll">Scroll stress</option>
    </select>
  </label>
  <label>Speed:
    <select id="speedSelect">
      <option value="60">60 fps</option>
      <option value="120">120 fps</option>
      <option value="max" selected>Max speed</option>
    </select>
  </label>
</div>

<canvas id="terminal"></canvas>

<div id="stats">
  <div class="stat"><div class="stat-value" id="sFps">—</div><div class="stat-label">FPS</div></div>
  <div class="stat"><div class="stat-value" id="sMs">—</div><div class="stat-label">ms / render</div></div>
  <div class="stat"><div class="stat-value" id="sTotal">—</div><div class="stat-label">renders</div></div>
  <div class="stat"><div class="stat-value" id="sChars">—</div><div class="stat-label">chars typed</div></div>
</div>

<div id="log"><p>Press ▶ Start to begin.</p></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const COLS    = 80
const ROWS    = 24
const FONT_PX = 14
const FONT    = `${FONT_PX}px "JetBrains Mono", "Fira Code", Menlo, monospace`
const DPR     = window.devicePixelRatio || 1

// Colours (terminal theme)
const BG_DEFAULT  = '#161310'
const FG_DEFAULT  = '#e8d5b0'
const FG_CURSOR   = '#e8a045'
const BG_CURSOR   = '#e8a045'
const FG_DIM      = '#555'

// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('terminal')
const ctx    = canvas.getContext('2d')

// Measure cell size from font metrics
ctx.font = FONT
const measured = ctx.measureText('M')
const CELL_W = Math.ceil(measured.width)
const CELL_H = Math.ceil(FONT_PX * 1.4)

const PX_W = COLS * CELL_W
const PX_H = ROWS * CELL_H

canvas.width  = PX_W * DPR
canvas.height = PX_H * DPR
canvas.style.width  = PX_W + 'px'
canvas.style.height = PX_H + 'px'
ctx.scale(DPR, DPR)
ctx.imageSmoothingEnabled = false

// ── Terminal grid ─────────────────────────────────────────────────────────────
// Each cell: { ch, fg, bg, bold }
const grid = Array.from({ length: ROWS }, () =>
  Array.from({ length: COLS }, () => ({ ch: ' ', fg: FG_DEFAULT, bg: BG_DEFAULT, bold: false }))
)
let cursorCol = 0
let cursorRow = 0

// Scrollback — simple array of row snapshots
const scrollback = []

const SAMPLE_TEXT =
  'function renderTerminal(cells, cols, rows) {\n' +
  '  for (let row = 0; row < rows; row++) {\n' +
  '    for (let col = 0; col < cols; col++) {\n' +
  '      const cell = cells[row * cols + col];\n' +
  '      drawCell(ctx, cell, col, row);\n' +
  '    }\n' +
  '  }\n' +
  '}\n'

let textPos = 0  // position in SAMPLE_TEXT cycling buffer

function typeChar(ch) {
  if (ch === '\n') {
    cursorCol = 0
    cursorRow++
    if (cursorRow >= ROWS) {
      scrollback.push(grid.shift().map(c => ({ ...c })))
      grid.push(Array.from({ length: COLS }, () => ({ ch: ' ', fg: FG_DEFAULT, bg: BG_DEFAULT, bold: false })))
      cursorRow = ROWS - 1
    }
    return
  }
  grid[cursorRow][cursorCol] = { ch, fg: FG_DEFAULT, bg: BG_DEFAULT, bold: false }
  cursorCol++
  if (cursorCol >= COLS) {
    cursorCol = 0
    cursorRow++
    if (cursorRow >= ROWS) {
      scrollback.push(grid.shift().map(c => ({ ...c })))
      grid.push(Array.from({ length: COLS }, () => ({ ch: ' ', fg: FG_DEFAULT, bg: BG_DEFAULT, bold: false })))
      cursorRow = ROWS - 1
    }
  }
}

function nextChar() {
  const ch = SAMPLE_TEXT[textPos % SAMPLE_TEXT.length]
  textPos++
  return ch
}

// ── Renderer ──────────────────────────────────────────────────────────────────
function renderGrid() {
  ctx.fillStyle = BG_DEFAULT
  ctx.fillRect(0, 0, PX_W, PX_H)

  ctx.font = FONT
  ctx.textBaseline = 'top'

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = grid[row][col]
      const x = col * CELL_W
      const y = row * CELL_H

      const isCursor = row === cursorRow && col === cursorCol
      if (isCursor) {
        ctx.fillStyle = BG_CURSOR
        ctx.fillRect(x, y, CELL_W, CELL_H)
        ctx.fillStyle = '#000'
      } else if (cell.bg !== BG_DEFAULT) {
        ctx.fillStyle = cell.bg
        ctx.fillRect(x, y, CELL_W, CELL_H)
        ctx.fillStyle = cell.fg
      } else {
        ctx.fillStyle = cell.fg
      }

      if (cell.ch !== ' ') {
        ctx.fillText(cell.ch, x, y)
      }
    }
  }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
let totalRenders = 0
let totalChars   = 0
let frameTimes   = []
let running      = false
let rafId        = null

function updateStats(frameMs) {
  frameTimes.push(frameMs)
  if (frameTimes.length > 60) frameTimes.shift()

  const avgMs  = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length
  const fps    = avgMs > 0 ? Math.round(1000 / avgMs) : 0

  document.getElementById('sFps').textContent    = fps
  document.getElementById('sMs').textContent     = avgMs.toFixed(2)
  document.getElementById('sTotal').textContent  = totalRenders
  document.getElementById('sChars').textContent  = totalChars
}

// ── Loop modes ────────────────────────────────────────────────────────────────
let lastFrameTime = 0

function tick(now) {
  if (!running) return

  const mode  = document.getElementById('modeSelect').value
  const speed = document.getElementById('speedSelect').value

  // Frame rate throttle
  if (speed !== 'max') {
    const interval = 1000 / Number(speed)
    if (now - lastFrameTime < interval) {
      rafId = requestAnimationFrame(tick)
      return
    }
  }
  lastFrameTime = now

  const t0 = performance.now()

  if (mode === 'keystroke') {
    typeChar(nextChar())
    totalChars++
  } else if (mode === 'burst') {
    // Paste 80 chars at once (one full line)
    for (let i = 0; i < 80; i++) {
      typeChar(nextChar())
      totalChars++
    }
  } else if (mode === 'scroll') {
    // Fill a whole row then scroll
    for (let i = 0; i < COLS; i++) {
      typeChar(nextChar())
      totalChars++
    }
    typeChar('\n')
  }

  renderGrid()
  totalRenders++

  const frameMs = performance.now() - t0
  updateStats(frameMs)

  rafId = requestAnimationFrame(tick)
}

// ── Controls ──────────────────────────────────────────────────────────────────
const btnStart = document.getElementById('btnStart')
const logEl    = document.getElementById('log')

function log(msg, hi = false) {
  const p = document.createElement('p')
  if (hi) p.className = 'hi'
  p.textContent = msg
  logEl.appendChild(p)
  logEl.scrollTop = logEl.scrollHeight
}

btnStart.addEventListener('click', () => {
  if (running) {
    running = false
    cancelAnimationFrame(rafId)
    btnStart.textContent = '▶ Start'
    btnStart.classList.remove('active')

    const avgMs = frameTimes.reduce((a, b) => a + b, 0) / (frameTimes.length || 1)
    log(`Stopped. ${totalRenders} renders, avg ${avgMs.toFixed(2)} ms/render, ${totalChars} chars typed.`, true)
  } else {
    running = true
    btnStart.textContent = '⏹ Stop'
    btnStart.classList.add('active')
    log(`Started — mode: ${document.getElementById('modeSelect').value}, speed: ${document.getElementById('speedSelect').value}`)
    rafId = requestAnimationFrame(tick)
  }
})

document.getElementById('btnReset').addEventListener('click', () => {
  running = false
  cancelAnimationFrame(rafId)
  btnStart.textContent = '▶ Start'
  btnStart.classList.remove('active')

  // Clear grid
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      grid[r][c] = { ch: ' ', fg: FG_DEFAULT, bg: BG_DEFAULT, bold: false }
  cursorCol = 0; cursorRow = 0; textPos = 0
  totalRenders = 0; totalChars = 0; frameTimes = []
  renderGrid()

  document.getElementById('sFps').textContent   = '—'
  document.getElementById('sMs').textContent    = '—'
  document.getElementById('sTotal').textContent = '—'
  document.getElementById('sChars').textContent = '—'
  log('Reset.')
})

// Initial render
renderGrid()
log(`Cell size: ${CELL_W}×${CELL_H}px  |  Grid: ${COLS}×${ROWS}  |  DPR: ${DPR}  |  Canvas: ${canvas.width}×${canvas.height}px`)
</script>
</body>
</html>

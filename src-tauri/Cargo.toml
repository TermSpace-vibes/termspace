[package]
name = "termspace"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is required for `Window::add_child` (native child webview panes).
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
alacritty_terminal = "0.24"
sysinfo = "0.39.3"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
tiny_http = "0.12"
base64 = "0.22.1"
parking_lot = "0.12"
tauri-plugin-clipboard-manager = "2"
whisper-rs = "0.16.0"
reqwest = { version = "0.11", features = ["json", "multipart"] }

[patch.crates-io]
portable-pty = { path = "portable-pty-0.9.0" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Objective-C runtime bindings: used by browser_pane_manager to enable
# WKWebView back/forward navigation gestures on macOS (non-Ghostty code).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

# alacritty_terminal -> rustix-openpty -> rustix 0.38 only enables the `fs`
# and `termios` features, leaving `std` off. Without `std`, rustix uses its
# no_std polyfill `OwnedFd`/`Errno` types, which do NOT interop with the
# corresponding `std` types -- breaking alacritty_terminal's tty/unix.rs.
# Declaring a direct dependency with `std` forces Cargo feature unification to
# turn it on for the whole graph. Unix-only because rustix 0.38 is unix here.
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["std", "fs", "termios"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"


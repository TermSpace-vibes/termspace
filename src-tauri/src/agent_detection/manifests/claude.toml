provider = "claude"
aliases = ["claude", "claude-code"]

[identity]
all = ["(?m)^\\s*[>❯›]_?\\s*"]
any = [
    "(?i)Claude Code",
    "(?i)\\? for shortcuts",
    "(?i)(bypass permissions|accept edits|plan mode)",
    "(?i)(\\bfor\\s+\\d+.*done|·\\s*done\\b)",
    "(?i)\\[(Sonnet|Opus|Haiku|Claude)",
    "(?i)auto mode on",
    "(?i)what should claude do"
]

[[rules]]
id = "transcript-viewer"
priority = 120
region = "active"
preserve_state = true
any = ["(?i)transcript", "(?i)press q to (quit|exit)"]

[[rules]]
id = "permission"
priority = 110
region = "active"
state = "blocked"
all = ["(?i)(allow|approve|permission)", "(?m)^\\s*❯?\\s*1\\.\\s*(yes|allow)"]
evidence = ["visible_blocker"]
detail = "Needs permission"

[[rules]]
id = "question"
priority = 100
region = "active"
state = "blocked"
all = ["(?m)^\\s*❯\\s*\\d+\\.", "(?m)^\\s*\\d+\\.\\s+"]
evidence = ["visible_blocker"]
detail = "Needs input"

[[rules]]
id = "background-work"
priority = 90
region = "active"
state = "working"
any = ["(?i)(working|running).*(background|agent|tool)", "(?i)(esc|ctrl-c) to interrupt"]
evidence = ["visible_working"]
detail = "Working..."

[[rules]]
id = "spinner"
priority = 80
region = "last:5"
state = "working"
any = [
    "(?im)^\\s*(\\+|[✢✳✶✻✽✱✲·*])\\s+[A-Za-z]+.*(…|\\.{3})",
    "(?im)^\\s*[✢✳✶✻✽✱✲]\\s+",
    "(?im)\\b(thinking|searching|reading|writing|running|executing|effecting|checking|inspecting|applying|fetching|building|testing|harmonizing|cogitating|pondering|ruminating|synthesizing)\\b.*(…|\\.{3})",
    "(?i)\\bthinking with (high|medium|low) effort\\b"
]
not = ["(?i)(\\bfor\\s+\\d+.*done|·\\s*done\\b)"]
evidence = ["visible_working"]
detail = "Working..."

[[rules]]
id = "streaming"
priority = 70
region = "last:5"
state = "working"
all = ["(?m)^\\s*[•●]\\s+"]
not = ["(?m)^\\s*[>❯›]_?\\s*$", "(?i)(\\bfor\\s+\\d+.*done|·\\s*done\\b)"]
evidence = ["visible_working"]
detail = "Working..."

[[rules]]
id = "input-prompt"
priority = 50
region = "active"
state = "idle"
all = ["(?m)^\\s*[>❯›]_?\\s*$"]
any = [
    "(?i)Claude Code",
    "(?i)\\? for shortcuts",
    "(?i)(bypass permissions|accept edits|plan mode)",
    "(?i)(\\bfor\\s+\\d+.*done|·\\s*done\\b)",
    "(?i)\\[(Sonnet|Opus|Haiku|Claude)",
    "(?i)auto mode on",
    "(?i)what should claude do"
]
not = ["(?m)^\\s*[>❯›]_?\\s*\\d+\\."]
evidence = ["visible_idle"]
detail = "Idle"
